name: BlueLyrics
options:
  bundleIdPrefix: com.blueguard
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2PV5B37GLP
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  BlueLyrics:
    type: application
    platform: macOS
    sources:
      - path: Sources/BlueLyrics
    resources:
      - path: Resources
        buildPhase: resources
        type: folder
      - path: Assets.xcassets
    info:
      path: Info.plist
    entitlements:
      path: BlueLyrics.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blueguard.bluelyrics
        PRODUCT_NAME: BlueLyrics
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: BlueLyrics.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: ShazamKit.framework
      - sdk: ScreenCaptureKit.framework
      - sdk: Speech.framework
      - sdk: AVFoundation.framework

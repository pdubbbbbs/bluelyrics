name: BlueLyricsTV
options:
  bundleIdPrefix: com.blueguard
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2PV5B37GLP
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Automatic
    TVOS_DEPLOYMENT_TARGET: "17.0"
targets:
  BlueLyricsTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources/BlueLyricsTV
      - path: Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blueguard.bluelyrics
        PRODUCT_NAME: BlueLyrics
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "BlueLyrics tvOS App Store 20260912"
    dependencies:
      - sdk: Network.framework
      - sdk: MusicKit.framework
